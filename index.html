<style>

.home-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.home-header h1{font-size:31px;letter-spacing:-.8px;margin:11px 0 6px}.home-header p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:#141b17;border-radius:13px;color:var(--soft)}
.summary{padding:18px;border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,#1b221d,#141917);box-shadow:var(--shadow);margin-bottom:18px}
.summary-top{display:flex;justify-content:space-between;align-items:flex-end}.kicker{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}.summary-number{font-size:34px;font-weight:780;letter-spacing:-1px;margin-top:3px}.summary-status{font-size:11px;color:var(--muted);padding-bottom:4px}
.summary-bar{height:8px;background:#2a332f;border-radius:99px;overflow:hidden;margin:13px 0 15px}.summary-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--sage));border-radius:99px;transition:width .3s}
.summary-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary-stats strong{display:block;font-size:15px}.summary-stats span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.tabs{display:flex;gap:4px;padding:3px;background:#141a17;border:1px solid #2d3631;border-radius:14px}.tab{height:38px;min-width:100px;border:0;border-radius:10px;background:transparent;color:#8e9891;font-size:12px;font-weight:700}.tab.active{background:#2a312b;color:#eadbbd}
.sort{border:0;background:transparent;color:var(--muted);font-size:12px;padding:7px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.card{background:var(--surface);border:1px solid #27322c;border-radius:18px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.16);transition:.16s;cursor:pointer}.card:hover{transform:translateY(-2px);border-color:#3e4a43}.card:active{transform:scale(.985)}
.cover{height:118px;position:relative;overflow:hidden;background:linear-gradient(135deg,#2a3a31,#637b66)}.cover.slate{background:linear-gradient(135deg,#2a343b,#697985)}.cover.amber{background:linear-gradient(135deg,#493626,#b98853)}.cover.sage{background:linear-gradient(135deg,#314332,#7b9870)}.cover.rose{background:linear-gradient(135deg,#443233,#8a6567)}.cover.sky{background:linear-gradient(135deg,#2b3b47,#698398)}.photo{width:100%;height:100%;object-fit:cover;display:block}.no-photo{
  position:relative;
  display:grid;
  place-items:center;
  height:100%;
  overflow:hidden;
  color:rgba(239,231,215,.48);

  letter-spacing:.05em;

    radial-gradient(circle at 74% 24%,rgba(183,201,185,.08) 0 30px,transparent 31px),

.no-photo::before{

  position:relative;
  z-index:2;
  padding:6px 9px;
  border:1px solid rgba(224,233,223,.10);

}.badge{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sage);color:#102016;font-weight:800}
.body{padding:13px}.body h3{font-size:14px;margin:0 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10.5px}.card-progress{height:4px;background:#29322e;border-radius:99px;overflow:hidden;margin-top:10px}.card-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--sage));border-radius:99px}.date-meta{display:flex;justify-content:space-between;border-top:1px solid #29322e;margin-top:9px;padding-top:9px;color:var(--muted);font-size:10px}.date-meta b{color:#cdd2cc;font-weight:650}
.create{grid-column:1/-1;height:112px;border:1px dashed #48534b;border-radius:18px;background:transparent;color:#d3d8d1;display:grid;place-items:center}.create .plus{font-size:34px;color:var(--amber);line-height:24px}.create .label{font-size:12px;margin-top:7px}
.empty{grid-column:1/-1;text-align:center;padding:38px 18px;border:1px dashed #39443e;border-radius:18px;background:#131915}.empty strong{display:block;font-size:14px;color:#dce1db;margin-bottom:5px}.empty span{font-size:12px;color:var(--muted)}

.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:calc(68px + env(safe-area-inset-bottom,0px));background:rgba(9,13,11,.97);border-top:1px solid #202923;display:flex;justify-content:center;gap:90px;padding-top:9px;padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;z-index:50}.nav{border:0;background:transparent;color:#7f8982;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:48px}.nav.active{color:var(--amber)}.nav span{font-size:21px}

.route{display:flex;align-items:center;gap:10px;margin-bottom:15px}.home-btn{width:40px;height:40px;border:1px solid var(--line);background:#151c18;border-radius:13px;color:var(--cream);font-size:20px}.route-wrap{min-width:0;flex:1}.route-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:2px}.route-name{font-size:21px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{border:1px solid var(--line);border-radius:21px;overflow:hidden;background:linear-gradient(145deg,#1b221d,#141917);box-shadow:var(--shadow);margin-bottom:14px}.hero-cover{height:150px;background:#1f2923}.hero-cover img{width:100%;height:100%;object-fit:cover}.hero-empty{height:100%;display:grid;place-items:center;color:#78837b;font-size:12px}.hero-body{padding:17px}.hero-body h2{margin:0 0 7px;font-size:23px;letter-spacing:-.4px}.hero-body p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.45}.detail-date{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid #29322e;font-size:11px}.detail-date span{color:var(--muted)}.detail-date b{font-weight:650;color:#dcded8}.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.detail-stat{background:#1c2520;border-radius:12px;padding:10px}.detail-stat b{font-size:15px}.detail-stat small{display:block;color:var(--muted);font-size:9.5px;margin-top:3px}
.detail-tabs{display:flex;gap:4px;padding:3px;background:#141a17;border:1px solid #2d3631;border-radius:14px;margin-bottom:14px}.detail-tab{flex:1;height:38px;border:0;background:transparent;border-radius:10px;color:#8f9993;font-size:11px;font-weight:700}.detail-tab.active{background:#2b322d;color:#eadfca;box-shadow:inset 0 0 0 1px rgba(217,168,97,.14)}
.focus{border:1px solid #455047;background:linear-gradient(145deg,#1a211d,#131815);border-radius:17px;padding:16px;margin-bottom:15px;box-shadow:0 10px 25px rgba(0,0,0,.12);position:relative;overflow:hidden}.focus:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--amber),var(--sage))}.focus-title{font-size:19px;font-weight:760;line-height:1.2}.focus-sub{font-size:11px;color:var(--muted);margin-top:6px}.focus-btn{margin-top:13px;width:100%;height:49px;border:0;border-radius:13px;background:linear-gradient(180deg,#e1b56c,#ce9f5d);color:#17140f;font-weight:760}.task-list{display:grid;gap:8px}.task{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid #27322c;border-radius:13px;padding:10px 11px}.task.done{background:#151d19}.task-text{flex:1;font-size:12px}.task.done .task-text{text-decoration:line-through;color:#78837b}.check{width:25px;height:25px;border-radius:8px;border:1px solid #556158;background:#19211d;color:#102016;display:grid;place-items:center;padding:0;font-size:13px}.check.done{background:var(--sage);border-color:var(--sage)}
.project-actions{display:flex;gap:9px;margin-top:15px}.project-actions button{height:44px;border:1px solid var(--line);background:#1b231e;color:#e7ece5;border-radius:12px;padding:0 14px;font-size:11px}.project-actions .danger{color:var(--danger)}
.shopping{border:1px solid #2f3934;border-radius:17px;background:#171e1a;padding:15px}.shop-summary{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:11px}.shop-summary strong{font-size:21px}.shop-summary small{display:block;color:var(--muted);font-size:10px}.materials{display:grid;gap:4px}.material{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #29322e}.material:last-child{border-bottom:0}.shop-check{width:26px;height:26px;border-radius:8px;border:1px solid #566259;background:#19211d;color:#102016;display:grid;place-items:center;padding:0;font-weight:800}.shop-check.done{background:var(--sage);border-color:var(--sage)}.material-main{flex:1;min-width:0}.material-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.material-info{font-size:10px;color:var(--muted);margin-top:3px}.material-total{font-size:12px;font-weight:650}.material.bought .material-name,.material.bought .material-total{text-decoration:line-through;color:#747f77}.mini-actions{display:flex;gap:3px}.mini-action{border:0;background:transparent;color:#88928b;padding:4px;font-size:16px}.shop-add{width:100%;height:45px;border:1px dashed #465149;border-radius:12px;background:#1b231e;color:#cbd3ca;font-size:12px;margin-top:12px}.costs{border-top:1px solid #2b342f;margin-top:13px;padding-top:11px;display:grid;gap:8px}.cost{display:flex;justify-content:space-between;font-size:11px}.cost span{color:var(--muted)}.over{color:var(--danger)!important}

.editor{border:1px solid #353f39;border-radius:20px;background:linear-gradient(145deg,#181f1b,#131815);padding:18px}.edit-section{border-top:1px solid #2b342f;padding:17px 0}.edit-section:first-child{border-top:0;padding-top:0}.edit-label{display:block;font-size:11px;color:#c5ccc5;margin-bottom:7px}.field{margin-bottom:16px}.edit-photo{display:flex;align-items:center;gap:11px}.edit-preview{width:76px;height:76px;border-radius:14px;border:1px solid #3b4740;background:#1b231e;overflow:hidden;display:grid;place-items:center;color:#7d8780;font-size:10px;text-align:center}.edit-preview img{width:100%;height:100%;object-fit:cover}.photo-actions{display:flex;gap:7px;flex-wrap:wrap}.mini{height:39px;border-radius:11px;border:1px solid #3a453e;background:#202823;color:#d8ddd6;padding:0 11px;font-size:11px}.mini.accent{background:#292a20;border-color:#61563a;color:#ead9b8}.edit-list{display:grid;gap:8px}.edit-row{display:grid;grid-template-columns:27px 1fr 31px;align-items:center;gap:8px;background:#1b231e;border:1px solid #2d3932;border-radius:12px;padding:7px}.edit-row input{height:41px;border:0;background:transparent;padding:7px}.save-row{position:sticky;bottom:0;display:flex;gap:9px;padding-top:15px;background:linear-gradient(transparent,#131815 23%)}.save-row button{height:49px;border:0;border-radius:13px}.save-cancel{width:105px;background:#202823;color:#e8ede7}.save-main{flex:1;background:linear-gradient(180deg,#e1b56c,#ce9f5d);color:#17140f;font-weight:760}

.dialog-backdrop{position:fixed;inset:0;background:rgba(2,5,4,.66);display:flex;align-items:flex-end;justify-content:center;z-index:100}.dialog{width:100%;max-width:430px;background:#151d19;border:1px solid #37423b;border-bottom:0;border-radius:22px 22px 0 0;padding:20px;box-shadow:0 -20px 70px rgba(0,0,0,.35)}.dialog h2{margin:0 0 6px;font-size:20px}.dialog p{margin:0 0 15px;color:var(--muted);font-size:12px;line-height:1.4}.dialog-fields{display:grid;gap:9px}.dialog-fields input{height:49px;border:1px solid #344038;background:#151d19;color:#eef2ec;border-radius:13px;padding:13px;outline:0}.dialog-actions{display:flex;gap:9px;margin-top:14px}.dialog-actions button{height:48px;border:0;border-radius:12px;flex:1}.dialog-cancel{background:#202823;color:#e8ede7}.dialog-save{background:linear-gradient(180deg,#acd796,#91bf80);color:#142015;font-weight:760}
.reward{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,6,4,.34);z-index:120;pointer-events:none}
.reward-card{min-width:220px;padding:20px 24px;border:1px solid #455148;border-radius:20px;background:rgba(22,29,25,.98);box-shadow:0 20px 70px rgba(0,0,0,.42);text-align:center;animation:rewardIn .22s ease both}
.reward-check{width:48px;height:48px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:var(--sage);color:#142016;font-size:22px;font-weight:800;box-shadow:none}
.reward-card strong{display:block;font-size:18px}.reward-card span{display:block;color:var(--muted);font-size:11px;margin-top:4px}@keyframes rewardIn{from{opacity:0;transform:scale(.96) translateY(7px)}to{opacity:1;transform:none}}

.detail-panel{display:none}.detail-panel.active{display:block}
/* v27 Edit Project skin */
.editor-shell{
  border:1px solid #303a34;
  border-radius:22px;
  background:#151b18;
  overflow:hidden;
  box-shadow:0 18px 45px rgba(0,0,0,.20);
}
.editor-top{
  padding:20px 18px 18px;
  background:linear-gradient(145deg,#1a211d,#151b18);
  border-bottom:1px solid #2a342e;
}
.editor-top .kicker{margin-bottom:7px}
.editor-top h1{margin:0;font-size:25px;line-height:1.08;letter-spacing:-.6px}
.editor-top p{margin:7px 0 0;color:var(--muted);font-size:11px;line-height:1.45}
.editor-section{padding:18px;border-top:1px solid #2a342e}
.editor-section:first-of-type{border-top:0}
.editor-title{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:11px}
.editor-field{margin-bottom:14px}
.editor-field:last-child{margin-bottom:0}
.editor-label{display:block;color:#c9cec8;font-size:11px;margin-bottom:7px}
.editor-field input,.editor-field textarea,.editor-field select{
  width:100%;
  border:1px solid #364139;
  background:#111714;
  color:#eef1eb;
  border-radius:12px;
  padding:12px 13px;
  outline:0;
  box-shadow:none;
  -webkit-appearance:none;
  appearance:none;
}
.editor-field input{height:47px}
.editor-field textarea{min-height:95px;resize:vertical;line-height:1.45}
.editor-field input:focus,.editor-field textarea:focus,.editor-field select:focus{
  border-color:#5a665c;
  background:#141b17;
}
.editor-select-wrap{position:relative}
.editor-select-wrap:after{
  content:"⌄";
  position:absolute;
  right:13px;
  top:12px;
  color:#8f9991;
  pointer-events:none;
}
.editor-select-wrap select{padding-right:35px}
.editor-photo{
  display:flex;
  align-items:center;
  gap:12px;
}
.editor-photo-preview{
  width:82px;height:82px;flex:none;
  border-radius:15px;
  border:1px solid #3a463e;
  background:#1c241f;
  display:grid;place-items:center;
  overflow:hidden;
  color:#7d8780;
  font-size:10px;text-align:center;
}
.editor-photo-preview img{width:100%;height:100%;object-fit:cover}
.editor-photo-copy{min-width:0;flex:1}
.editor-photo-copy strong{display:block;font-size:12px;color:#dfe4de;margin-bottom:4px}
.editor-photo-copy span{display:block;font-size:10px;color:var(--muted);line-height:1.4;margin-bottom:10px}
.editor-photo-actions{display:flex;gap:7px;flex-wrap:wrap}
.editor-mini{
  height:37px;padding:0 11px;
  border:1px solid #3b473f;border-radius:10px;
  background:#202823;color:#d9ded8;font-size:10.5px;
  display:inline-flex;align-items:center;justify-content:center;
}
.editor-mini.primary{background:#2a2920;border-color:#5d5439;color:#ead9b9}
.editor-steps-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.editor-count{font-size:10px;color:#818c84}
.editor-list{display:grid;gap:8px}

  display:grid;
  grid-template-columns:28px 1fr 31px;
  gap:8px;align-items:center;

  padding:7px;

  width:27px;height:27px;border-radius:8px;

  display:grid;place-items:center;font-size:10px
}

  width:100%;
  height:40px;
  border:0;

  background:transparent;
  color:#eef1eb;
  padding:6px 4px;
  box-shadow:none;
  appearance:none;
}
.editor-row input::placeholder{color:#737e76}
.editor-delete{
  width:29px;height:29px;border:0;border-radius:8px;
  background:transparent;color:#7e8981;font-size:17px
}
.editor-delete:hover{background:#26302a;color:#cdd3cd}
.editor-add{
  width:100%;height:44px;margin-top:9px;
  border:1px dashed #465149;border-radius:12px;
  background:#1a221d;color:#cbd3ca;font-size:11px
}
.editor-add:active{transform:scale(.99)}
.editor-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.editor-savebar{
  position:sticky;bottom:0;
  display:flex;gap:9px;
  padding:14px 18px 17px;
  background:linear-gradient(transparent,#131815 23%);
  border-top:1px solid rgba(48,58,52,.6);
}
.editor-savebar button{height:49px;border-radius:13px;font-size:11px}
.editor-cancel{
  width:105px;
  border:1px solid #313b35!important;
  background:#202823;color:#e7ece6;
}
.editor-save{
  flex:1;border:0;background:linear-gradient(180deg,#e3b76f,#cf9f5d);
  color:#18150f;font-weight:760;
  box-shadow:0 8px 22px rgba(0,0,0,.16);
}
.editor-save:active,.editor-cancel:active{transform:scale(.985)}

.create-shell{border:1px solid #303a34;border-radius:22px;background:#151b18;overflow:hidden;box-shadow:0 18px 45px rgba(0,0,0,.2)}

function renderProfile(){
  const ps=state.projects;
  const active=ps.filter(p=>!p.completed);
  const finished=ps.filter(p=>p.completed);
  const totalSteps=ps.reduce((sum,p)=>sum+p.steps.length,0);
  const doneSteps=ps.reduce((sum,p)=>sum+p.steps.filter(s=>s.done).length,0);
  const recentFinished=[...finished].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,3);

  $("profile").innerHTML=`<div class="route">
    <div class="route-wrap"><div class="route-kicker">Profile</div><div class="route-name">${esc(profile.name||"Your profile")}</div></div>
  </div>
  <div class="profile-shell">
    <section class="profile-hero">
      <div class="profile-avatar">${profile.photo?`<img src="${esc(profile.photo)}" alt="">`:`<span>${esc((profile.name||"Y").slice(0,1).toUpperCase())}</span>`}</div>
      <div class="profile-copy"><div class="profile-kicker">Your Buildflow</div><h1>${esc(profile.name||"Your profile")}</h1><p>${esc(profile.about||"Add a little about yourself.")}</p></div>
      <button class="profile-edit-btn" id="profileEditBtn" type="button">Edit</button>
    </section>
    <section class="profile-section"><div class="profile-title">Your project history</div>
      <div class="profile-stats">
        <div class="profile-stat"><strong>${ps.length}</strong><span>Projects</span></div>
        <div class="profile-stat"><strong>${active.length}</strong><span>In progress</span></div>
        <div class="profile-stat"><strong>${finished.length}</strong><span>Finished</span></div>
        <div class="profile-stat"><strong>${doneSteps}</strong><span>Steps done</span></div>
      </div>
    </section>
    <section class="profile-section"><div class="profile-title">Your progress</div>
      <div class="profile-progress-card"><div><strong>${finished.length}</strong><span>projects finished</span></div><div><strong>${doneSteps}/${totalSteps||0}</strong><span>steps completed</span></div></div>
    </section>
    <section class="profile-section"><div class="profile-title">Recently finished</div><div class="profile-finished-list" id="profileFinishedList"></div></section>
  </div>`;
    $("profileEditBtn").onclick=profileDialog;

  const list=$("profileFinishedList");
  if(!recentFinished.length){
    list.innerHTML='<div class="profile-empty"><strong>No finished projects yet</strong><span>Finished projects will appear here.</span></div>';
  }else{
    recentFinished.forEach(project=>{
      const row=document.createElement("button");
      row.type="button";row.className="profile-finished";
      row.innerHTML=`<span class="profile-finished-cover ${esc(project.cover)}">${project.photo?`<img src="${esc(project.photo)}" alt="">`:""}</span>
      <span class="profile-finished-main"><strong>${esc(project.name)}</strong><small>${project.steps.length} steps · ${dateText(project.date)}</small></span>
      <span class="profile-finished-arrow">›</span>`;
      row.onclick=()=>openProject(project.id);
      list.appendChild(row);
    });
  }
}
function profileDialog(){
  $("dialog").innerHTML=`<div class="dialog"><h2>Edit profile</h2><p>Keep this simple. This is your own Buildflow space.</p>
    <div class="dialog-fields">
      <input id="pName" maxlength="40" placeholder="Your name" value="${esc(profile.name)}">
      <input id="pAbout" maxlength="80" placeholder="A little about you" value="${esc(profile.about)}">
      <div class="editor-photo" style="margin-top:2px">
        <div class="editor-photo-preview">${profile.photo?`<img src="${esc(profile.photo)}" alt="">`:'<span>No photo</span>'}</div>
        <div class="editor-photo-copy"><strong>Profile photo</strong><span>Take a photo or upload one from your device.</span>
          <div class="editor-photo-actions">
            <label class="editor-mini primary" for="pPhoto">${profile.photo?"Change photo":"Add photo"}</label>
            <button class="editor-mini" id="pRemovePhoto" type="button" ${profile.photo?"":"disabled"}>Remove</button>
            <input id="pPhoto" type="file" accept="image/*" hidden>
          </div>
        </div>
      </div>
    </div>
    <div class="dialog-actions"><button class="dialog-cancel" id="dialogCancel">Cancel</button><button class="dialog-save" id="profileSave">Save</button></div></div>`;
  $("dialog").classList.remove("hidden");
  $("dialogCancel").onclick=closeDialog;
  $("pPhoto").onchange=async ev=>{
    const f=ev.target.files?.[0];if(!f)return;
    try{profile.photo=await resizeImage(f,700,.82);profileDialog()}catch{toast("Couldn't use that photo.");profileDialog()}
  };
  $("pRemovePhoto").onclick=()=>{profile.photo="";profileDialog()};
  $("profileSave").onclick=()=>{
    profile.name=$("pName").value.trim();profile.about=$("pAbout").value.trim();saveProfile();closeDialog();renderProfile();toast("Profile saved.");
  };
  requestAnimationFrame(()=>$("pName").focus());
}

function u(key){const map=GLOBAL_UI[settings.language]||GLOBAL_UI.en;return map[key]||GLOBAL_UI.en[key]||key}
function localizeRendered(root=document){
  const map=GLOBAL_UI[settings.language]||GLOBAL_UI.en;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];let n;
  while(n=walker.nextNode())nodes.push(n);
  nodes.forEach(node=>{
    const text=node.nodeValue.trim();
    if(map[text])node.nodeValue=node.nodeValue.replace(text,map[text]);
  });
  root.querySelectorAll?.("[placeholder],[aria-label]").forEach(el=>{
    ["placeholder","aria-label"].forEach(attr=>{
      const v=el.getAttribute(attr);
      if(v&&map[v])el.setAttribute(attr,map[v]);
    });
  });
}

function normalize(raw){
  const projects=Array.isArray(raw?.projects)?raw.projects:[];
  return {projects:projects.map((p,i)=>({
    id:String(p?.id??`${Date.now()}-${i}`),
    name:String(p?.name||"Untitled project"),
    description:String(p?.description||""),
    details:String(p?.details||""),
    category:String(p?.category||"Personal"),
    date:String(p?.date||""),
    budget:Number(p?.budget)||0,
    priority:!!p?.priority,
    photo:String(p?.photo||""),
    cover:["sage","slate","amber","rose","sky"].includes(p?.cover)?p.cover:"sage",
    createdAt:Number(p?.createdAt)||Date.now(),
    completed:!!p?.completed,
    steps:Array.isArray(p?.steps)?p.steps.map((s,j)=>({id:String(s?.id??j+1),text:String(s?.text||"").trim(),done:!!s?.done})).filter(s=>s.text):[],
    materials:Array.isArray(p?.materials)?p.materials.map((m,j)=>({id:String(m?.id??j+1),name:String(m?.name||"").trim(),qty:Number(m?.qty)||1,price:Number(m?.price)||0,bought:!!m?.bought})).filter(m=>m.name):[]
  }))};
}
function $(id){return document.getElementById(id)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function money(v){
  const n=Number(v)||0;
  const code=settings.currency;
  const symbol=currencySymbol(code);
  const value=n.toLocaleString("en-US",{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}).replace(/,/g," ");
  const suffix=["NOK","SEK","DKK"].includes(code);
  return suffix?`${value} ${symbol}`:`${symbol}${value}`;
}
function dateText(v){if(!v)return"No target date";const d=new Date(v+"T12:00:00");return Number.isNaN(d.getTime())?"No target date":d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function pget(id){return state.projects.find(p=>p.id===id)||null}
function pct(p){return p.steps.length?Math.round(p.steps.filter(s=>s.done).length/p.steps.length*100):0}
function syncBottomNav(name){
  $("homeNav")?.classList.toggle("active",name==="home");
  $("profileNav")?.classList.toggle("active",name==="profile");
  $("settingsNav")?.classList.toggle("active",name==="settings");
}
function showScreen(name){
  ["home","project","wizard","editor","settings","profile","success"].forEach(x=>$(x).classList.toggle("hidden",x!==name));
  $("bottom").classList.toggle("hidden",false);
syncBottomNav(name);
  view.screen=name;
}
function goHome(){
  view.projectId=null;view.projectTab="overview";view.homeTab="active";
  $("activeProjectsTab")?.classList.add("active");$("finishedProjectsTab")?.classList.remove("active");
  showScreen("home");applyLanguage();renderHome();window.scrollTo(0,0);
}
function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.add("hidden"),1250);
}
function reward(title,sub,final=false){
  const r=$("reward");
  r.innerHTML=`<div class="reward-card"><div class="reward-check">✓</div><strong>${esc(title)}</strong><span>${esc(sub)}</span></div>`;
  r.classList.remove("hidden");
  clearTimeout(rewardTimer);
  rewardTimer=setTimeout(()=>{
    r.classList.add("hidden");
    r.innerHTML="";
  },final?1350:850);
}
function updateStats(){
  const ps=state.projects,active=ps.filter(p=>!p.completed).length,finished=ps.filter(p=>p.completed).length;
  const average=ps.length?Math.round(ps.reduce((a,p)=>a+pct(p),0)/ps.length):0;
  $("overallProgress").textContent=average+"%";$("overallBar").style.width=average+"%";
  $("activeCount").textContent=active;$("finishedCount").textContent=finished;
  $("plannedBudget").textContent=money(ps.reduce((a,p)=>a+p.budget,0));
  $("summaryStatus").textContent=ps.length?`${active} ${active===1?(settings.language==="no"?"prosjekt":"project"):(settings.language==="no"?"prosjekter":"projects")} ${settings.language==="no"?"pågår":"in progress"}`:u("noProjects");
}
function renderHome(){
  const h=$("home");
  h.innerHTML=`<div class="home-header"><div><div class="brand"><span class="brand-mark"></span><span class="brand-name">BUILDFLOW</span></div><h1>Your projects</h1><p>Everything you're working toward, in one place.</p></div></div>
  <div class="summary"><div class="summary-top"><div><div class="kicker">Overall progress</div><div class="summary-number" id="overallProgress">0%</div></div><div class="summary-status" id="summaryStatus">No projects yet</div></div><div class="summary-bar"><span id="overallBar"></span></div><div class="summary-stats"><div><strong id="activeCount">0</strong><span>In progress</span></div><div><strong id="finishedCount">0</strong><span>Finished</span></div><div><strong id="plannedBudget">€0</strong><span>Planned</span></div></div></div>
  <div class="toolbar"><div class="tabs"><button class="tab ${view.homeTab==="active"?"active":""}" id="activeProjectsTab">In progress</button><button class="tab ${view.homeTab==="finished"?"active":""}" id="finishedProjectsTab">Finished</button></div><button class="sort" id="sortBtn">${view.sort==="recent"?"Recent":"Name"} <span>⌄</span></button></div>
  <div class="grid" id="homeGrid"></div>`;
  updateStats();
  localizeRendered($("home"));
  $("activeProjectsTab").onclick=()=>{view.homeTab="active";renderHome()};
  $("finishedProjectsTab").onclick=()=>{view.homeTab="finished";renderHome()};
  $("sortBtn").onclick=()=>{view.sort=view.sort==="recent"?"name":"recent";renderHome()};
  $("settingsNav").onclick=openSettings;
  const grid=$("homeGrid");
  let ps=state.projects.filter(p=>view.homeTab==="finished"?p.completed:!p.completed);
  ps.sort((a,b)=>{
    if(!!b.priority!==!!a.priority)return b.priority?1:-1;
    if(view.sort==="name")return a.name.localeCompare(b.name);
    return (b.createdAt||0)-(a.createdAt||0);
  });
  if(!ps.length){
    const empty=document.createElement("div");empty.className="empty";empty.innerHTML=view.homeTab==="finished"?'<strong>No finished projects</strong><span>Completed projects collect here.</span>':'<strong>Nothing in progress</strong><span>Start something with a clear finish line.</span>';grid.appendChild(empty);
  }else{
    ps.forEach(p=>{
      const card=document.createElement("article");card.className="card"+(p.priority?" priority-card":"");
      const d=p.steps.filter(s=>s.done).length,progress=pct(p);
      card.innerHTML=`${p.priority?'<div class="priority-line"></div><div class="priority-label">PRIORITY</div>':''}<div class="cover ${esc(p.cover)}">${p.photo?`<img class="photo" src="${esc(p.photo)}" alt="">`:'<div class="no-photo"><span>No photo</span></div>'}${p.completed?'<div class="badge">✓</div>':''}</div><div class="body"><h3>${esc(p.name)}</h3><div class="meta"><span>${d}/${p.steps.length} steps</span><span>${progress}%</span></div><div class="card-progress"><span style="width:${progress}%"></span></div>${p.date?`<div class="date-meta"><span>${p.completed?"Finished":"Target"}</span><b>${esc(dateText(p.date))}</b></div>`:""}</div>`;
      card.onclick=()=>openProject(p.id);grid.appendChild(card);
    });
  }
  if(view.homeTab==="active"){
    const add=document.createElement("button");add.className="create";add.innerHTML='<div><div class="plus">+</div><div class="label">Create new project</div></div>';add.onclick=openWizard;grid.appendChild(add);
  }
}

function openSettings(){
  showScreen("settings");
  renderSettings();
  window.scrollTo(0,0);
}

    <div class="settings-section">
      <div class="settings-kicker">Preferences</div>

function openProject(id){if(!pget(id))return;view.projectId=id;view.projectTab="overview";showScreen("project");renderProject();window.scrollTo(0,0)}
function renderProject(){
  const p=pget(view.projectId);if(!p){goHome();return}
  const ps=$("project");const progress=pct(p),done=p.steps.filter(s=>s.done).length,total=p.materials.reduce((a,m)=>a+m.qty*m.price,0);
  ps.innerHTML=`<div class="route"><button class="home-btn" id="projectHome" aria-label="Home">⌂</button><div class="route-wrap"><div class="route-kicker">Project</div><div class="route-name">${esc(p.name)}</div></div></div>
  <div class="hero"><div class="hero-cover">${p.photo?`<img src="${esc(p.photo)}" alt="">`:'<div class="hero-empty">No photo added</div>'}</div><div class="hero-body"><h2>${esc(p.name)}</h2><p>${esc(p.details||p.description||"No project description yet.")}</p><div class="detail-date"><span>Target date</span><b>${esc(dateText(p.date))}</b></div><div class="detail-stats"><div class="detail-stat"><b>${progress}%</b><small>Progress</small></div><div class="detail-stat"><b>${done}/${p.steps.length}</b><small>Steps</small></div><div class="detail-stat"><b>${money(p.budget)}</b><small>Budget</small></div></div></div></div>
  <div class="detail-tabs"><button class="detail-tab ${view.projectTab==="overview"?"active":""}" id="overviewTab">Overview</button><button class="detail-tab ${view.projectTab==="shopping"?"active":""}" id="shoppingTab">Shopping list</button></div>
  <div id="overviewPanel" class="detail-panel ${view.projectTab==="overview"?"active":""}"></div>
  <div id="shoppingPanel" class="detail-panel ${view.projectTab==="shopping"?"active":""}"></div>`;
  renderOverview(p);renderShopping(p);showDetailTab(view.projectTab);
  localizeRendered($("project"));
  $("projectHome").onclick=goHome;
  $("overviewTab").onclick=()=>showDetailTab("overview");
  $("shoppingTab").onclick=()=>showDetailTab("shopping");
}
function renderOverview(p){
  const op=$("overviewPanel"); const next=p.steps.findIndex(s=>!s.done);
  op.innerHTML=`<div class="focus" id="focusCard"></div><div class="section-head"><h2>Steps</h2></div><div class="task-list" id="taskList"></div>
  <div class="project-actions"><button id="editBtn" type="button">Edit project</button><button id="deleteBtn" class="danger" type="button">Delete project</button></div>`;
  const focus=$("focusCard");
  if(p.completed){
    focus.innerHTML='<div class="kicker">Finished</div><div class="focus-title">Project complete.</div><div class="focus-sub">All steps are complete.</div>';
  }else{
    focus.innerHTML=`<div class="kicker">Up next</div><div class="focus-title">${esc(p.steps[next]?.text||"Add your first step")}</div><div class="focus-sub">${next>=0?`Step ${next+1} of ${p.steps.length}`:"Your project needs a step."}</div>${next>=0?'<button class="focus-btn" id="focusBtn">✓ &nbsp; Mark step complete</button>':""}`;
    if(next>=0)$("focusBtn").onclick=()=>toggleStep(p.id,next);
  }
  const list=$("taskList");
  p.steps.forEach((st,i)=>{
    const row=document.createElement("div");row.className="task"+(st.done?" done":"");
    row.innerHTML=`<button class="check ${st.done?"done":""}" type="button" aria-label="Complete step">${st.done?"✓":""}</button><div class="task-text">${esc(st.text)}</div>`;
    row.querySelector(".check").onclick=()=>toggleStep(p.id,i);
    list.appendChild(row);
  });
  $("editBtn").onclick=openEdit;
  $("deleteBtn").onclick=openDelete;
}
function toggleStep(id,i){
  const p=pget(id);if(!p)return;const wasAll=p.completed;p.steps[i].done=!p.steps[i].done;p.completed=p.steps.length>0&&p.steps.every(s=>s.done);if(p.completed&&!wasAll)p.priority=false;save();renderHome();renderProject();
  if(p.steps[i].done){
    const messages=["Checked off.","Step complete.","That's done.","Moving on.","Progress made."];
    reward(p.completed&&!wasAll?"Project finished":messages[Math.floor(Math.random()*messages.length)],p.completed&&!wasAll?"All steps are complete.":`${p.steps.filter(s=>s.done).length}/${p.steps.length} steps complete.`,p.completed&&!wasAll);
  }else toast("Step reopened.");
}
function renderShopping(p){
  const sp=$("shoppingPanel");
  const total=p.materials.reduce((a,m)=>a+m.qty*m.price,0);
  const bought=p.materials.filter(m=>m.bought).length;
  sp.innerHTML=`<div class="shopping">
    <div class="shop-summary">
      <div><small>Shopping list</small><strong>${money(total)}</strong></div>
      <small>${bought}/${p.materials.length} bought</small>
    </div>
    <div class="materials" id="materials"></div>
    <button class="shop-add" id="addMaterialBtn">＋ Add to shopping list</button>
    <div class="costs">
      <div class="cost"><span>Budget</span><b>${money(p.budget)}</b></div>
      <div class="cost"><span>Shopping list</span><b>${money(total)}</b></div>
      <div class="cost"><span>${total<=p.budget?"Remaining":"Over budget"}</span><b class="${total>p.budget?"over":""}">${money(Math.abs(p.budget-total))}</b></div>
    </div>
  </div>`;
  const box=$("materials");
  if(!p.materials.length){
    box.innerHTML='<div class="empty" style="padding:28px 14px"><strong>Shopping list is empty</strong><span>Add the things you need for this project.</span></div>';
  }else{
    p.materials.forEach(m=>{
      const row=document.createElement("div");
      row.className="material"+(m.bought?" bought":"");
      row.innerHTML=`<button class="shop-check ${m.bought?"done":""}" type="button" aria-label="Toggle bought">${m.bought?"✓":""}</button>
      <div class="material-main"><div class="material-name">${esc(m.name)}</div><div class="material-info">${m.qty} × ${money(m.price)}</div></div>
      <div class="material-total">${money(m.qty*m.price)}</div>
      <div class="mini-actions"><button class="mini-action" type="button" aria-label="Edit item">✎</button><button class="mini-action" type="button" aria-label="Remove item">×</button></div>`;
      row.querySelector(".shop-check").onclick=()=>toggleMaterial(m.id);
      row.querySelectorAll(".mini-action")[0].onclick=()=>editMaterial(m.id);
      row.querySelectorAll(".mini-action")[1].onclick=()=>removeMaterial(m.id);
      box.appendChild(row);
    });
  }
  $("addMaterialBtn").onclick=()=>materialDialog();
}
function toggleMaterial(id){const p=pget(view.projectId),m=p?.materials.find(x=>x.id===id);if(!m)return;m.bought=!m.bought;save();view.projectTab="shopping";renderProject();showDetailTab("shopping");showToast(m.bought?"Added to bought list.":"Moved back to shopping.");}
function showDetailTab(tab){
  view.projectTab=tab;
  const overview=document.getElementById("overviewPanel");
  const shopping=document.getElementById("shoppingPanel");
  const ot=document.getElementById("overviewTab");
  const st=document.getElementById("shoppingTab");
  if(!overview||!shopping||!ot||!st)return;
  const isShopping=tab==="shopping";
  overview.classList.toggle("active",!isShopping);
  shopping.classList.toggle("active",isShopping);
  ot.classList.toggle("active",!isShopping);
  st.classList.toggle("active",isShopping);
  ot.setAttribute("aria-selected",String(!isShopping));
  st.setAttribute("aria-selected",String(isShopping));
}
function materialDialog(existing=null){
  dialogAction={type:existing?"editMaterial":"newMaterial",id:existing?.id||null};
  $("dialog").innerHTML=`<div class="dialog"><h2>${existing?"Edit":"Add"} shopping item</h2><p>Keep the list simple. Add the item, quantity and price.</p><div class="dialog-fields"><input id="dName" placeholder="What do you need?" value="${existing?esc(existing.name):""}"><input id="dQty" type="number" min="0.01" step="0.01" value="${existing?existing.qty:1}" placeholder="Quantity"><input id="dPrice" type="number" min="0" step="0.01" value="${existing?existing.price:""}" placeholder="Price per item"></div><div class="dialog-actions"><button class="dialog-cancel" id="dialogCancel">Cancel</button><button class="dialog-save" id="dialogSave">${existing?"Save changes":"Add item"}</button></div></div>`;
  $("dialog").classList.remove("hidden");localizeRendered($("dialog"));$("dialogCancel").onclick=closeDialog;$("dialogSave").onclick=saveMaterialDialog;requestAnimationFrame(()=>$("dName").focus());
}
function saveMaterialDialog(){
  const name=$("dName").value.trim(),qty=Number($("dQty").value),price=Number($("dPrice").value);
  if(!name||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0){toast("Enter a name, quantity and valid price.");return}
  const p=pget(view.projectId);if(dialogAction.type==="editMaterial"){const m=p.materials.find(x=>x.id===dialogAction.id);if(m){m.name=name;m.qty=qty;m.price=price}}else p.materials.push({id:uid(),name,qty,price,bought:false});
  save();closeDialog();renderProject();view.projectTab="shopping";renderProject();
}
function editMaterial(id){const p=pget(view.projectId),m=p?.materials.find(x=>x.id===id);if(m)materialDialog(m)}
function removeMaterial(id){const p=pget(view.projectId);if(!p)return;confirmDialog("Remove item?","This removes it from the shopping list.",()=>{p.materials=p.materials.filter(m=>m.id!==id);save();renderProject();view.projectTab="shopping";renderProject()})}
function addStepDialog(id){textDialog("Add step","Give the step a short, concrete name.","",value=>{if(!value.trim())return;const p=pget(id);p.steps.push({id:uid(),text:value.trim(),done:false});p.completed=false;save();renderProject();showDetailTab("overview")})}
function editStep(id,i){const p=pget(id);textDialog("Edit step","Keep the step short and concrete.",p.steps[i].text,value=>{if(!value.trim())return;p.steps[i].text=value.trim();save();renderProject();showDetailTab("overview")})}
function textDialog(title,hint,value,cb){
  $("dialog").innerHTML=`<div class="dialog"><h2>${esc(title)}</h2><p>${esc(hint)}</p><div class="dialog-fields"><input id="textField" value="${esc(value)}" placeholder="Step name"></div><div class="dialog-actions"><button class="dialog-cancel" id="dialogCancel">Cancel</button><button class="dialog-save" id="dialogSave">Save</button></div></div>`;
  $("dialog").classList.remove("hidden");$("dialogCancel").onclick=closeDialog;$("dialogSave").onclick=()=>{const v=$("textField").value;closeDialog();cb(v)};requestAnimationFrame(()=>$("textField").focus());
}
function resetAppDialog(){
  $("dialog").innerHTML=`<div class="dialog">
    <h2>Reset app?</h2>
    <p>This permanently deletes all projects, profile data and local settings from this browser.</p>
    <div class="reset-confirm-copy">Type <strong>RESET APP</strong> to confirm.</div>
    <input id="resetConfirmInput" class="reset-confirm-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="RESET APP">
    <div class="dialog-actions">
      <button class="dialog-cancel" id="dialogCancel">Cancel</button>
      <button class="dialog-save" id="dialogConfirm" type="button" disabled>Delete</button>
    </div>
  </div>`;
  $("dialog").classList.remove("hidden");
  $("dialogCancel").onclick=closeDialog;
  const input=$("resetConfirmInput"),confirm=$("dialogConfirm");
  const sync=()=>{
    const ok=input.value.trim().toUpperCase()==="RESET APP";
    confirm.disabled=!ok;
  };
  input.oninput=sync;
  confirm.onclick=()=>{
    if(input.value.trim().toUpperCase()!=="RESET APP")return;
    closeDialog();
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(SETTINGS_KEY);
    localStorage.removeItem(PROFILE_KEY);
    location.reload();
  };
  requestAnimationFrame(()=>input.focus());
}
function confirmDialog(title,hint,cb){
  $("dialog").innerHTML=`<div class="dialog"><h2>${esc(title)}</h2><p>${esc(hint)}</p><div class="dialog-actions"><button class="dialog-cancel" id="dialogCancel">Cancel</button><button class="dialog-save" id="dialogConfirm">Delete</button></div></div>`;
  $("dialog").classList.remove("hidden");localizeRendered($("dialog"));$("dialogCancel").onclick=closeDialog;$("dialogConfirm").onclick=()=>{closeDialog();cb()};
}
function openDelete(){confirmDialog("Delete project?","This removes the project and its shopping list from this browser.",()=>{state.projects=state.projects.filter(p=>p.id!==view.projectId);save();goHome();toast("Project deleted.")})}
function closeDialog(){$("dialog").classList.add("hidden");$("dialog").innerHTML="";dialogAction=null}
function openWizard(){
  wizard={step:1,name:"",details:"",steps:["",""],budget:"",date:"",category:"Personal",photo:"",priority:false};
  showScreen("wizard");renderWizard();window.scrollTo(0,0)
}
function renderWizard(){
  const d=wizard;
  const titleMap={
    1:["Start with the idea","Give your project a clear name."],
    2:["Add the context","Add the details that will help later."],
    3:["Plan the steps","Turn the project into a simple sequence."],
    4:["Set the basics","Budget and target date are optional."],

    content=`<div class="create-section-label">Context</div>

        <div class="create-field"><label class="create-label" for="wDate">Target date</label><input id="wDate" type="date" value="${esc(d.date)}"></div>
      </div>
      <div class="create-hint">Both are optional. You can change them later.</div>`;
  }else{
    content=`<div class="create-section-label">Personalize</div>
      <div class="create-field"><label class="create-label">Project photo <span style="color:var(--muted)">(optional)</span></label>
        <div class="create-photo">
          <div class="create-photo-preview">${d.photo?`<img src="${esc(d.photo)}" alt="">`:"No photo"}</div>
          <div class="create-photo-copy"><strong>Use a photo of your project</strong><span>It becomes the project's visual identity on Home.</span>
            <div class="create-photo-actions"><label class="create-mini primary" for="wPhoto">Add photo</label><button class="create-mini" id="wRemovePhoto" type="button">Remove</button><input id="wPhoto" type="file" accept="image/*" hidden></div>

        </div>
      </div>

        <div class="create-hint">Choose what fits this project best.</div>
      </div>
      <label class="priority-toggle"><input id="wPriority" type="checkbox" ${d.priority?"checked":""}><span class="priority-box"></span><span><strong>Priority project</strong><small>Keep this project at the top of your list.</small></span></label>`;
  }

  $("wizard").innerHTML=`<div class="route"><button class="home-btn" id="createHome" type="button" aria-label="Home">⌂</button><div class="route-wrap"><div class="route-kicker">New project</div><div class="route-name">${esc(title)}</div></div></div>
  <div class="create-shell"><div class="create-head"><div class="create-head-top"><div class="create-step-label">Step ${d.step}</div><div class="create-counter">5 steps</div></div><h1>${esc(title)}</h1><p>${esc(sub)}</p><div class="create-dots">${[1,2,3,4,5].map(i=>`<i class="${i<=d.step?"on":""}"></i>`).join("")}</div></div><div class="create-body">${content}</div>

function attachStepReorder(box,items,setItems,render){
  if(!box)return;
  box.querySelectorAll(".step-reorderable").forEach((row,index)=>{
    let holdTimer=null,moveMode=false,startX=0,startY=0,lastY=0,targetIndex=index,pointerId=null;
    const clearDrop=()=>{
      box.querySelectorAll(".step-drop-target").forEach(r=>r.classList.remove("step-drop-target"));
    };
    const cancelHold=()=>{
      if(holdTimer){clearTimeout(holdTimer);holdTimer=null}
    };
    const endMove=()=>{
      cancelHold();
      if(!moveMode)return;
      const from=index;
      const destination=Math.max(0,Math.min(targetIndex,items.length-1));
      if(destination!==from){
        const moved=items.splice(from,1)[0];
        items.splice(destination,0,moved);
        setItems(items);
      }
      moveMode=false;
      row.classList.remove("step-moving");
      clearDrop();
      render();
    };
    row.addEventListener("pointerdown",ev=>{
      if(ev.target.closest("input,button"))return;
      pointerId=ev.pointerId;
      startX=ev.clientX;startY=ev.clientY;lastY=ev.clientY;
      cancelHold();
      holdTimer=setTimeout(()=>{
        moveMode=true;
        row.classList.add("step-moving");
        row.setPointerCapture?.(pointerId);
      },320);
    });
    row.addEventListener("pointermove",ev=>{
      if(!moveMode){
        if(Math.abs(ev.clientY-startY)>8||Math.abs(ev.clientX-startX)>8)cancelHold();
        return;
      }
      ev.preventDefault();
      lastY=ev.clientY;
      const rows=[...box.querySelectorAll(".step-reorderable")];
      let candidate=0,bestDistance=Infinity;
      rows.forEach((other,j)=>{
        if(other===row)return;
        const r=other.getBoundingClientRect(),center=r.top+r.height/2;
        const distance=Math.abs(ev.clientY-center);
        if(distance<bestDistance){bestDistance=distance;candidate=ev.clientY>center?j:j}
      });
      targetIndex=candidate;
      clearDrop();
      const target=rows[targetIndex];
      if(target&&target!==row)target.classList.add("step-drop-target");
    });
    row.addEventListener("pointerup",ev=>{
      if(!moveMode){
        cancelHold();
        return;
      }
      endMove();
    });
    row.addEventListener("pointercancel",()=>{
      cancelHold();
      if(moveMode){moveMode=false;row.classList.remove("step-moving");clearDrop();render()}
    });
  });
}

function readWizard(){
  if(wizard.step===1)wizard.name=$("wName").value.trim();
  if(wizard.step===2)wizard.details=$("wDetails").value.trim();
  if(wizard.step===4){wizard.budget=$("wBudget").value;wizard.date=$("wDate").value}
  if(wizard.step===5){wizard.category=$("wCategory").value;wizard.priority=$("wPriority").checked}
}
function validateWizard(){
  readWizard();
  if(wizard.step===1&&!wizard.name){toast("Give the project a name.");$("wName").focus();return false}
  if(wizard.step===3){
    wizard.steps=wizard.steps.map(s=>s.trim()).filter(Boolean);
    if(!wizard.steps.length){toast("Add at least one step.");return false}
  }
  if(wizard.step===4&&wizard.budget!==""&&(Number(wizard.budget)<0||!Number.isFinite(Number(wizard.budget)))){toast("Enter a valid budget.");return false}
  return true;
}

function renderEditorSteps(){
  const box=$("eSteps");

function saveEdit(){
  const p=pget(view.projectId);
  if(!p)return;

  const name=$("eName").value.trim();
  const steps=editor.steps.map(s=>({text:s.text.trim(),done:!!s.done})).filter(s=>s.text);

  if(!name){toast("Give the project a name.");$("eName").focus();return}
  if(!steps.length){toast("Add at least one step.");return}

  p.name=name.slice(0,50);
  p.description=$("eDesc").value.trim();
  p.details=$("eDetails").value.trim();
  p.budget=Math.max(0,Number($("eBudget").value)||0);
  p.date=$("eDate").value||"";
  p.category=$("eCategory").value;
  p.priority=!!$("ePriority").checked;
  p.photo=editor.photo||"";
  p.steps=steps.map((step,i)=>({
    id:p.steps[i]?.id||uid(),
    text:step.text,
    done:p.steps[i]?.done ?? step.done
  }));
  p.completed=p.steps.length>0&&p.steps.every(step=>step.done);

  save();
  renderHome();
  openProject(p.id);
  toast("Changes saved.");
}
function resizeImage(file,maxSide=1100,quality=.78){
  return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,img.naturalWidth*scale);c.height=Math.max(1,img.naturalHeight*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",quality))};img.src=r.result};r.readAsDataURL(file)})
}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)}
